[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acquisense"
version = "4.2.0"
description = "AcquiSense — Production-Ready Multi-Agent M&A Due Diligence Platform (Google ADK + CrewAI + GPT-4o via AICredits + MCP + A2A + Durable Blackboard)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pydantic==2.9.2",
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "httpx==0.27.2",
    "PyJWT==2.9.0",
    "cryptography>=38.0.4",
    "google-adk>=0.1.0",
    "litellm>=1.50.0",
    "crewai>=0.80.0",
    "mcp>=1.1.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["acquisense*"]
